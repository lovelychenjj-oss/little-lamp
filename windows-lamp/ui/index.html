<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none';"><title>小灯当家</title><link rel="stylesheet" href="lamp.css"></head><body><main id="lamp" data-mode="light" data-skin="mushroom"><span class="ambient-light" aria-hidden="true"></span><span class="down-light" aria-hidden="true"></span><span class="ground-light" aria-hidden="true"></span><button id="body" aria-label="拖动灯身移动台灯，方向键微调位置"><span class="artwork" aria-hidden="true"></span><span class="stem"></span><span class="shade"></span><span class="base"></span></button><button id="knob" title="点击切换光线；任务栏托盘台灯图标可换灯具" aria-label="切换阅读档位"><span></span></button><button id="pull" aria-label="向下拉绳切换光线" title="按住绳坠向下拉，松手换档"><span class="cord"></span><span class="bead"></span></button><button id="sphere-touch" aria-label="在灯球上划动切换光线" title="按住灯球划一下，松手换档；也可滚动切换"></button><button id="drag-handle" title="按住拖动灯具" aria-label="移动灯具，可拖动或使用方向键">⠿</button><button id="minimize" title="收起台灯" aria-label="收起台灯，保留当前光线"><span aria-hidden="true">−</span></button><div id="label" role="status" aria-live="polite">日间</div></main><script src="catalog.js"></script><script src="lamp.js"></script></body></html>
